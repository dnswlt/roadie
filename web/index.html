<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadie</title>
  <link rel="icon" href="{{FAVICON}}" type="image/svg+xml">
  <link rel="stylesheet" href="{{APP_CSS}}">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="brand">
        <img class="brand-logo" src="{{FAVICON}}" alt="" width="20" height="20">
        Roadie
      </span>
      <!-- The roadmap's name is the door into Home (list, new/import, trash):
           clicking the roadmap you are in to reach the others is what everyone
           reaches for, so its chevron is honest. It stays live with no roadmap
           open — that is when Home is needed most. Actions hang off the "…". -->
      <button id="rm-picker" class="rm-trigger" title="Roadmaps"></button>
      <div class="menu-wrap">
        <button id="rm-actions" class="icon-btn" title="Roadmap actions"></button>
        <div id="rm-menu-pop" class="menu hidden">
          <button id="rm-rename" class="menu-item">Rename</button>
          <button id="rm-schedule" class="menu-item">Edit schedule</button>
          <button id="rm-duplicate" class="menu-item">Duplicate</button>
          <button id="rm-export" class="menu-item">Export</button>
          <button id="rm-copy-md" class="menu-item">Copy as Markdown</button>
          <button id="rm-history" class="menu-item">Version history</button>
          <!-- Visibility: hidden unless you own this roadmap (see app.ts
               renderVisibilityItem). Its label and icon flip with the current
               state. Down here with the rare operations rather than beside
               Rename — you change a roadmap's visibility about once. -->
          <button id="rm-visibility" class="menu-item hidden"></button>
          <button id="rm-delete" class="menu-item menu-danger">Delete roadmap</button>
        </div>
      </div>
      <input id="rm-import-file" type="file" accept=".json,application/json" hidden>
      <!-- Find searches the loaded roadmap, not the rendered chart: hidden
           contexts, folded children, labels and descriptions are all reachable
           here and none of them are reachable by the browser's own Ctrl+F. -->
      <div class="menu-wrap" id="find-wrap">
        <button id="find-menu" class="icon-btn" title="Find items (/)"></button>
        <div id="find-pop" class="menu find-pop hidden"></div>
      </div>
      <div class="menu-wrap" id="lane-vis-wrap">
        <button id="lane-vis-menu" class="icon-btn" title="Show/hide contexts"></button>
        <div id="lane-vis-pop" class="menu hidden"></div>
      </div>
      <div class="menu-wrap" id="filter-wrap">
        <button id="filter-menu" class="icon-btn" title="Filter items"></button>
        <div id="filter-pop" class="menu hidden"></div>
      </div>
      <button id="fold-all" class="icon-btn"></button>
      <span class="spacer"></span>
      <!-- Snap and zoom act on the time axis; renderTopbar hides both wraps
           while the WBS view is active. -->
      <div class="menu-wrap" id="snap-wrap">
        <button id="snap-menu" class="icon-btn" title="Snap grid"></button>
        <div id="snap-pop" class="menu hidden"></div>
      </div>
      <div class="zoom" id="zoom-controls">
        <button id="zoom-fit" class="icon-btn" title="Zoom to fit (z)"></button>
        <button id="zoom-out" class="icon-btn" title="Zoom out (Ctrl+scroll)"></button>
        <button id="zoom-in" class="icon-btn" title="Zoom in (Ctrl+scroll)"></button>
      </div>
      <!-- The view group: timeline, WBS, and Jira Recon as one segmented
           control, the current view lit (renderTopbar). "v" cycles the chart
           pair only — Recon is a task you visit, not a way of working, and is
           hidden unless the deployment has a tracker connection. The group
           must stay after the wraps above, which hide outside the timeline:
           before them, switching views moved these buttons out from under the
           pointer that had just pressed them. -->
      <div class="view-group">
        <button id="view-timeline" class="icon-btn" title="Timeline view (v)"></button>
        <button id="view-wbs" class="icon-btn" title="WBS view (v)"></button>
        <button id="view-recon" class="icon-btn hidden"
          title="Jira Recon — check this roadmap against Jira"></button>
      </div>
      <button id="help-menu" class="icon-btn" title="Help"></button>
      <!-- Shown only when the server runs with authentication; on an open
           deployment there is no account concept to expose. -->
      <div class="menu-wrap hidden" id="account-wrap">
        <button id="account-menu" class="icon-btn" title="Account"></button>
        <div id="account-pop" class="menu hidden">
          <div id="account-who" class="menu-head"></div>
          <button id="account-signout" class="menu-item">Sign out</button>
        </div>
      </div>
    </header>
    <div class="main">
      <div id="snapshot-banner" class="snapshot-banner hidden"></div>
      <div id="chart" class="chart-scroll"></div>
      <div id="panel-resize" title="Drag to resize"></div>
      <aside id="panel" class="panel"></aside>
      <aside id="history" class="history"></aside>
    </div>
    <div id="toasts"></div>
    <dialog id="dialog"></dialog>
    <!-- Home has its own element so #dialog's prompts/confirms can stack on
         top of it as nested modals. Content is built by home.ts on open. -->
    <dialog id="home-dialog"></dialog>
  </div>
  <script src="{{APP_JS}}"></script>
</body>
</html>
