site_name: Roadie
site_description: Roadmapping for large software and systems projects
site_url: https://dnswlt.github.io/roadie/
repo_url: https://github.com/dnswlt/roadie
repo_name: dnswlt/roadie

theme:
  name: material
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections

nav:
  - Start here:
      - Overview: index.md
      - Key concepts: concepts.md
  - Working with roadmaps:
      - Managing roadmaps: managing-roadmaps.md
      - Integration milestones: integration-milestones.md
      - Version history: version-history.md
  - Jira reconciliation:
      - Finding missing links: jira-reconciliation.md
      - Schedule check: schedule-check.md

plugins:
  - search

markdown_extensions:
  - admonition

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
